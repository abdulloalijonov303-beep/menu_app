<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, sans-serif;
    }

    body {
      background: #0b1220;
      color: white;
    }

    /* ===== HEADER ===== */
    .nav {
      background: #111827;
      padding: 15px 20px;
      border-bottom: 1px solid #1f2937;
    }

    .nav h2 {
      font-size: 18px;
    }

    /* ===== LAYOUT ===== */
    .container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      max-width: 1200px;
      margin: 20px auto;
      padding: 10px;
    }

    /* ===== FORM ===== */
    .form {
      background: #111827;
      padding: 15px;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: fit-content;
    }

    .form h3 {
      font-size: 14px;
      margin-bottom: 5px;
    }

    .form input,
    .form select {
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #1f2937;
      color: white;
      font-size: 13px;
    }

    /* ===== UPLOAD ===== */
    .upload-box {
      background: #1f2937;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      border: 1px dashed #374151;
      color: #9ca3af;
      font-size: 13px;
      position: relative;
    }

    .upload-box:hover {
      border-color: #22c55e;
      color: white;
    }

    .upload-box input {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      left: 0;
      top: 0;
      cursor: pointer;
    }

    /* BUTTON */
    .form button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .form button:hover {
      background: #16a34a;
    }

    /* ===== GRID LIST ===== */
    .list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    /* ===== CARD ULTRA ===== */
    .card {
      background: #111827;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1f2937;
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #22c55e;
    }

    .card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
    }

    .card-body {
      padding: 8px;
    }

    .card-body h3 {
      font-size: 13px;
    }

    .card-body p {
      font-size: 11px;
      color: #9ca3af;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .price {
      color: #facc15;
      font-size: 12px;
      font-weight: bold;
    }

    .delete {
      background: #ef4444;
      border: none;
      padding: 5px 7px;
      border-radius: 6px;
      font-size: 11px;
      color: white;
      cursor: pointer;
    }

    .delete:hover {
      background: #b91c1c;
    }

    /* ===== RESPONSIVE ===== */
    @media(max-width:1000px) {
      .container {
        grid-template-columns: 1fr;
      }

      .list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media(max-width:600px) {
      .list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="form">

      <h2>Add Food</h2>

      <input type="text" id="title" placeholder="Food name">

      <select id="category">
        <option value="">Category</option>
        <option>Taomlar</option>
        <option>Shirinliklar</option>
        <option>Ichimliklar</option>
        <option>Salqin Ichimliklar</option>
        <option>Qahva va Choy</option>
      </select>

      <input type="number" id="price" placeholder="Price">

      <input type="text" id="bat" placeholder="Batafsil">

      <input type="file" id="imageFile">

      <button onclick="addFood()">ADD FOOD</button>

      <button onclick="window.location.href='index.html'">
        BACK
      </button>

    </div>

    <div class="list" id="list"></div>

  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <script>

    const socket = io();

    let foods = [];

    socket.on("update-foods", (data) => {

      foods = data;

      render();

    });

    async function addFood() {

      const title = document.getElementById("title").value;
      const category = document.getElementById("category").value;
      const price = document.getElementById("price").value;
      const bat = document.getElementById("bat").value;
      const file = document.getElementById("imageFile").files[0];

      if (!title || !category || !price || !bat || !file) {
        alert("Hamma joyni toldir");
        return;
      }

      const formData = new FormData();

      formData.append("image", file);

      const res = await fetch("/upload", {
        method: "POST",
        body: formData
      });

      const data = await res.json();

      socket.emit("add-food", {
        title,
        category,
        price,
        bat,
        image: data.imagePath
      });

      document.getElementById("title").value = "";
      document.getElementById("price").value = "";
      document.getElementById("bat").value = "";
      document.getElementById("imageFile").value = "";

    }

    function deleteFood(id) {

      socket.emit("delete-food", id);

    }

    function render() {

      const list = document.getElementById("list");

      list.innerHTML = "";

      foods.forEach(f => {

        list.innerHTML += `
    
    <div class="card">

      <img src="${f.image}">

      <div class="card-body">

        <h2>${f.title}</h2>

        <p>${f.category}</p>

        <p>${f.price} so'm</p>

        <button class="delete" onclick="deleteFood(${f.id})">
          DELETE
        </button>

      </div>

    </div>
    
    `;

      });

    }

  </script>

</body>

</html>
