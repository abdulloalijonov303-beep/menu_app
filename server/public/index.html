   <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

   <script>

      const socket = io();

      let allFoods = [];
      let viewFoods = [];

      socket.on("update-foods", (data) => {

         allFoods = data;

         filterFood("All");

      });

      function filterFood(category) {

         if (category === "All") {
            viewFoods = allFoods;
         } else {
            viewFoods = allFoods.filter(f => f.category === category);
         }

         render();

      }

      function render() {

         const menu = document.getElementById("menu");

         menu.innerHTML = "";

         viewFoods.forEach(item => {

            menu.innerHTML += `
    <div class="card">
   <img class="ti" src="${item.image}">
    <div class="det"> 
      <p class="p">${item.category}</p>
       <h1>${item.title}</h1> <p class="som">${item.price} so'm</p> 
             <p class="p2">${item.bat} <br></p>

       </div> 
       </div>
`;

         });

      }

 let lang = localStorage.getItem("lang") || "en";

const translations = {

  uz: {

    loginError: "Login yoki parol xato"
  },
  ru: {

    fast: "Фастфуд",
    salad: "Салаты",
    dessert: "Десерт",
    drinks: "Напитки",
    loginError: "Неверный логин или пароль"
  }
};
function setLang(l) {
  lang = l;
  localStorage.setItem("lang", l);

  document.getElementById("langBtn").innerText =
    l === "en" ? "🌐 EN" : l === "uz" ? "🌐 UZ" : "🌐 RU";

  document.getElementById("langMenu").classList.remove("active");

  updateUI();
  filterFood("All");
}

function toggleLangMenu() {
  document.getElementById("langMenu").classList.toggle("active");
}

function updateUI() {
  const t = translations[lang];

  const btns = document.querySelectorAll(".buttons button");

  btns[0].innerText = t.all;
  btns[1].innerText = t.national;
  btns[2].innerText = t.fast;
  btns[3].innerText = t.salad;
  btns[4].innerText = t.dessert;
  btns[5].innerText = t.drinks;
}


setLang(lang);


   </script>
  <script>

    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        {
          pageLanguage: 'uz',
          includedLanguages: 'uz,ru,en'
        },
        'google_translate_element'
      );
    }

    function changeLanguage(lang) {

      const select = document.querySelector(".goog-te-combo");

      if(select){
        select.value = lang;
        select.dispatchEvent(new Event("change"));
      }

      localStorage.setItem("lang", lang);
    }

    document
      .getElementById("languageSelect")
      .addEventListener("change", function () {

        changeLanguage(this.value);

      });

    window.addEventListener("load", () => {

      const savedLang = localStorage.getItem("lang");

      if(savedLang){

        document.getElementById("languageSelect").value = savedLang;

        setTimeout(() => {

          changeLanguage(savedLang);

        },1000);

      }

    });

  </script>

  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
