<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Menu</title>
   <link rel="stylesheet" href="./style.css">

</head>

<body>
   <!-- LOCK SCREEN -->
   <div class="lock-screen" id="lockScreen">
      <div class="lock-box">
         <h2>🔐 Admin Login</h2> <input type="text" id="login" placeholder="Login"> <input type="password" id="password"
            placeholder="Password"> <button onclick="checkLogin()">ENTER</button> <button
            onclick="back()">Orqaga</button>
         <p id="errorText"></p>
      </div>
   </div>
   <div class="container2">
      <div class="nav">
         <div class="lang-switcher">
  <button id="langBtn" class="lang-btn">
    <img id="currentFlag" src="https://flagcdn.com/w40/gb.png" />
    <span id="currentLang">English</span>
    <span>▼</span>
  </button>

  <div id="langMenu" class="lang-menu hidden">
    <div class="lang-item" data-lang="en">
      <img src="https://flagcdn.com/w40/gb.png" />
      <span>English</span>
    </div>

    <div class="lang-item" data-lang="uz">
      <img src="https://flagcdn.com/w40/uz.png" />
      <span>O‘zbekcha</span>
    </div>

    <div class="lang-item" data-lang="ru">
      <img src="https://flagcdn.com/w40/ru.png" />
      <span>Русский</span>
    </div>
  </div>
</div>
         <div class="start">
            <div class="s"> <img
                  src="./logo.jpg"
                  onclick="openLockScreen()">
               <h1>GALATA</h1>
            </div>
         </div>
         <div class="burger" onclick="toggleMenu(this)"> <span></span> <span></span> <span></span> </div>
         <div class="menu" id="menu2">
            <div class="buttons"> <button onclick="filterFood('All')">Hammasi</button> <button
                  onclick="filterFood('Uzbek Milliy Taom')">Milliy</button> <button
                  onclick="filterFood('FastFood')">Fast Food</button> <button
                  onclick="filterFood('Salatlar')">Salatlar</button> <button
                  onclick="filterFood('Desert')">Desert</button> <button
                  onclick="filterFood('Ichimliklar')">Ichimliklar</button> </div>
         </div>
      </div>
      <div class="container">
         <div class="taomlar" id="menu"></div>
      </div>
   </div>
   

   <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

   <script>

const langBtn = document.getElementById("langBtn");
const langMenu = document.getElementById("langMenu");
const currentFlag = document.getElementById("currentFlag");
const currentLang = document.getElementById("currentLang");

const languages = {
  en: {
    name: "English",
    flag: "https://flagcdn.com/w40/gb.png"
  },
  uz: {
    name: "O‘zbekcha",
    flag: "https://flagcdn.com/w40/uz.png"
  },
  ru: {
    name: "Русский",
    flag: "https://flagcdn.com/w40/ru.png"
  }
};

// open/close menu
langBtn.addEventListener("click", () => {
  langMenu.classList.toggle("hidden");
});

// change language
document.querySelectorAll(".lang-item").forEach(item => {
  item.addEventListener("click", () => {
    const lang = item.getAttribute("data-lang");

    currentLang.textContent = languages[lang].name;
    currentFlag.src = languages[lang].flag;

    localStorage.setItem("lang", lang);
    langMenu.classList.add("hidden");

    applyLanguage(lang);
  });
});

// simple example text change
function applyLanguage(lang) {
  const texts = {
    en: "Welcome to our menu",
    uz: "Bizning menyuga xush kelibsiz",
    ru: "Добро пожаловать в меню"
  };

  document.getElementById("title").textContent = texts[lang];
}

// load saved language
const savedLang = localStorage.getItem("lang") || "en";
document.querySelector(`[data-lang="${savedLang}"]`).click();


      const socket = io();

      let allFoods = [];
      let viewFoods = [];

      socket.on("update-foods", (data) => {

         allFoods = data;

         filterFood("All");

      });

      function filterFood(category) {

         if (category === "All") {
            viewFoods = allFoods;
         } else {
            viewFoods = allFoods.filter(f => f.category === category);
         }

         render();

      }

      function render() {

         const menu = document.getElementById("menu");

         menu.innerHTML = "";

         viewFoods.forEach(item => {

            menu.innerHTML += `
    <div class="card">
   <img class="ti" src="${item.image}">
    <div class="det"> 
      <p class="p">${item.category}</p>
       <h1>${item.title}</h1> <p class="som">${item.price} so'm</p> 
             <p class="p2">${item.bat} <br></p>

       </div> 
       </div>
`;

         });

      }


      function openLockScreen(){
   document.getElementById("lockScreen").classList.add("active") } 


function checkLogin(){
   const login = document.getElementById("login").value 
   const password = document.getElementById("password").value 
   if(login === "admin" && password === "1234")
   { 
    window.location.href = "admin.html" 

   }
    else { document.getElementById("errorText").innerText = "Login yoki parol xato" 

    } }


function toggleMenu(x){ x.classList.toggle("active")
 document.getElementById("menu2").classList.toggle("active") }

 function back(){
  window.location.href = "index.html"
 }

   </script>

</body>

</html>
