<style>

/* ========== RESET ========== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #ffffff;
  color: rgb(0, 0, 0);
}

/* ========== WRAPPER ========== */
.page {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* ========== CARD ========== */
.card {
  width: 100%;
  max-width: 900px;
  background: #ffffff;
  border-radius: 20px;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1fr 1fr;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

/* ========== IMAGE ========== */
.img-box {
  width: 100%;
  height: 100%;
}

.img-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ========== INFO ========== */
.info {
  padding: 25px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.tag {
  background: #22c55e;
  display: inline-block;
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 12px;
  width: fit-content;
}

.title {
  font-size: 28px;
}

.price {
  font-size: 22px;
  color: #facc15;
  font-weight: bold;
}

.desc {
  color: #cbd5e1;
  font-size: 14px;
}

/* ========== BUTTONS ========== */
.btn {
  padding: 12px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

.back {
  background: #334155;
  color: white;
}

.back:hover {
  background: #475569;
}

.call {
  background: #22c55e;
  color: white;
}

.call:hover {
  background: #16a34a;
}
.acall{
  color: white;
  text-decoration: none;
}

/* ========== MOBILE ========== */
@media (max-width: 768px) {

  .card {
    grid-template-columns: 1fr;
  }

  .img-box {
    height: 250px;
  }

  .title {
    font-size: 22px;
  }

}

</style>

</head>
